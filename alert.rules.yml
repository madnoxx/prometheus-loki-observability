groups:
  - name: system_alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance)(irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Высокая загрузка CPU"
          description: "CPU выше 80% более 2 минут на {{ $labels.instance }}"
